version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wind_forecast_backend
    ports:
      - "8000:8000"
    environment:
      - ELEXON_API_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - ELEXON_HTTP_TIMEOUT=30.0
      - DEFAULT_START_DATE=2026-01-01
      - DEFAULT_END_DATE=2026-01-31
      - DEFAULT_CUTOFF_TIME_UK=11:00
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,*
    volumes:
      - ./backend/data/cache:/app/backend/data/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wind_forecast_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
